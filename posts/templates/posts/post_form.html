{% extends "base.html" %}
{% block title %}Create New Post{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 800px;">
    <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
        <h5 class="fw-bold text-dark mb-4"><i class="fa-solid fa-pen-to-square text-primary me-2"></i>Create New Social Post</h5>

        <!-- ⚠️ enctype="multipart/form-data" অবশ্যই থাকতে হবে -->
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- Post Content / Caption Field (এখন সম্পূর্ণ Optional) -->
            <div class="mb-4">
                <label class="form-label fw-bold text-secondary">Post Caption / Message <span class="text-muted fw-normal">(Optional)</span></label>
                <textarea name="content" class="form-control rounded-3 p-3" rows="4" placeholder="Write your post caption here... (optional — you can post media only)"></textarea>
            </div>

            <!-- Image/Video Upload Field with Instant Preview -->
            <div class="mb-4">
                <label class="form-label fw-bold text-secondary"><i class="fa-solid fa-image text-primary me-1.5"></i>Upload Attachment (Image or Video)</label>
                
                <!-- ⬇️ image + video উভয়ই accept করা হচ্ছে -->
                <input type="file" name="media_file" id="imageInput" class="form-control rounded-3" accept="image/*,video/*" onchange="previewImage(event)">
                
                <!-- Instant Image Preview Box -->
                <div class="mt-3 text-center d-none" id="previewContainer">
                    <p class="small text-muted mb-1">Selected File Preview:</p>
                    <img id="imagePreview" src="#" alt="Preview" class="img-fluid rounded-3 shadow-sm border d-none" style="max-height: 250px; object-fit: cover;">
                    <video id="videoPreview" controls class="img-fluid rounded-3 shadow-sm border d-none" style="max-height: 250px;"></video>
                </div>
            </div>

            <!-- Select Platforms/Channels Field -->
            <div class="mb-4">
                <label class="form-label fw-bold text-secondary">Select Social Platforms</label>
                <div class="d-flex flex-wrap gap-3">
                    {{ form.social_accounts }}
                </div>
            </div>

            <!-- Publish / Schedule Action Buttons -->
            <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                <a href="{% url 'post_list' %}" class="btn btn-light px-4 fw-bold">Cancel</a>
                <button type="submit" name="post_type" value="instant" class="btn btn-primary px-4 fw-bold shadow-sm">
                    <i class="fa-solid fa-paper-plane me-1.5"></i>Publish Now
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Image/Video Instant Preview JavaScript -->
<script>
function previewImage(event) {
    const input = event.target;
    if (input.files && input.files[0]) {
        const file = input.files[0];
        const isVideo = file.type.startsWith('video/');
        const reader = new FileReader();

        reader.onload = function(e) {
            document.getElementById('previewContainer').classList.remove('d-none');
            const imgEl = document.getElementById('imagePreview');
            const vidEl = document.getElementById('videoPreview');

            if (isVideo) {
                vidEl.src = e.target.result;
                vidEl.classList.remove('d-none');
                imgEl.classList.add('d-none');
            } else {
                imgEl.src = e.target.result;
                imgEl.classList.remove('d-none');
                vidEl.classList.add('d-none');
            }
        }
        reader.readAsDataURL(file);
    }
}
</script>
{% endblock %}
