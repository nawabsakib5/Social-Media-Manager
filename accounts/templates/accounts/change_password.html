{% extends "base.html" %}
{% block title %}Change Password{% endblock %}

{% block content %}
<style>
    /* ── 3D Glassmorphism Password Card ── * /
    .password-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(226, 232, 240, 0.8);
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
        padding: 40px;
        max-width: 500px;
        margin: 0 auto;
        transform-style: preserve-3d;
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        opacity: 0;
        transform: translateY(30px) translateZ(-50px);
    }

    .password-card:hover {
        transform: translateY(-5px) translateZ(15px);
        box-shadow: 0 30px 60px rgba(15, 23, 42, 0.12);
        border-color: rgba(13, 148, 136, 0.3);
    }
    
    .input-group-text {
        background: #f1f5f9;
        border: 1.5px solid #e2e8f0;
        border-right: none;
        border-radius: 12px 0 0 12px;
        color: var(--accent, #0d9488);
        font-size: 15px;
    }

    .form-control {
        background: #f8fafc;
        border: 1.5px solid #e2e8f0;
        border-radius: 0 12px 12px 0;
        padding: 12px 16px;
        font-size: 14px;
        font-weight: 500;
        transition: all 0.3s ease;
    }

    .form-control:focus {
        background: #fff;
        border-color: var(--accent, #0d9488);
        box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.12);
    }

    .security-tip-box {
        background: rgba(240, 249, 255, 0.8);
        border: 1px solid rgba(186, 230, 253, 0.8);
        backdrop-filter: blur(10px);
        padding: 16px;
        border-radius: 14px;
        font-size: 13.5px;
        color: #0369a1;
        box-shadow: 0 4px 15px rgba(3, 105, 161, 0.03);
    }

    .btn-update {
        background: var(--accent-gradient, linear-gradient(135deg, #0d9488 0%, #14b8a6 100%));
        color: white;
        border: none;
        padding: 14px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 15px;
        width: 100%;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        box-shadow: 0 8px 25px var(--accent-glow, rgba(13, 148, 136, 0.3));
    }

    .btn-update:hover {
        transform: translateY(-2px) translateZ(10px);
        box-shadow: 0 12px 30px rgba(13, 148, 136, 0.4);
        color: white;
    }

    .header-anim {
        opacity: 0;
        transform: translateY(-20px);
    }
</style>

<div class="container-fluid px-0" style="perspective: 1500px;">
    <!-- Header Section -->
    <div class="d-flex justify-content-between align-items-center mb-4 header-anim" id="pageHeader">
        <div>
            <h4 class="fw-extrabold mb-1" style="font-weight: 800; letter-spacing: -0.5px; color: #0f172a;">Change Password</h4>
            <p class="text-muted small" style="font-size: 14px;">Update your credentials to secure your workspace.</p>
        </div>
        <a href="{% url 'post_list' %}" class="btn btn-light btn-sm px-3 rounded-pill fw-semibold shadow-sm" style="border: 1px solid #e2e8f0; transition: all 0.3s ease;">
            <i class="fa-solid fa-arrow-left me-2 text-teal"></i>Back
        </a>
    </div>

    <!-- Password Form Card -->
    <div class="password-card" id="passwordCard">
        <form method="POST" class="needs-validation" novalidate>
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label text-xs fw-bold text-uppercase text-muted" style="font-size: 11px; letter-spacing: 0.8px;">Current Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" name="old_pass" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label text-xs fw-bold text-uppercase text-muted" style="font-size: 11px; letter-spacing: 0.8px;">New Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                    <input type="password" name="new_pass" class="form-control" placeholder="New password" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-xs fw-bold text-uppercase text-muted" style="font-size: 11px; letter-spacing: 0.8px;">Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-check-double"></i></span>
                    <input type="password" name="con_pass" class="form-control" placeholder="Confirm new password" required>
                </div>
            </div>

            <div class="security-tip-box mb-4">
                <i class="fa-solid fa-shield-halved me-2" style="color: var(--accent, #0d9488);"></i>
                <strong>Pro-tip:</strong> A strong password should be at least 8 characters long, including symbols and numbers.
            </div>

            <button type="submit" class="btn-update">
                Update Security Credentials <i class="fa-solid fa-shield-check ms-2"></i>
            </button>
        </form>
    </div>
</div>

<!-- GSAP Animation Script -->
<script>
document.addEventListener('DOMContentLoaded', () => {
    if (typeof gsap !== 'undefined') {
        const tl = gsap.timeline();

        tl.to("#pageHeader", {
            opacity: 1,
            y: 0,
            duration: 0.6,
            ease: "power2.out"
        })
        .to("#passwordCard", {
            opacity: 1,
            y: 0,
            z: 0,
            duration: 0.8,
            ease: "power3.out"
        }, "-=0.3");
    }
});
</script>
{% endblock %}
