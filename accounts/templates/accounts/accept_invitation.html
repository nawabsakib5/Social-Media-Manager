<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Complete Setup | SocialManager</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --accent: #0d9488; /* Teal-600 */
            --accent-gradient: linear-gradient(135deg, #0d9488 0%, #14b8a6 100%);
            --accent-glow: rgba(13, 148, 136, 0.3);
            --bg-color: #f4f6f9;
            --card-border: rgba(226, 232, 240, 0.8);
            --card-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
        }

        * { 
            box-sizing: border-box; 
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            perspective: 1500px;
        }

        /* ── Futuristic 3D Floating Background Mesh ── */
        .bg-mesh {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 15% 20%, rgba(13, 148, 136, 0.06) 0%, transparent 40%),
                        radial-gradient(circle at 85% 80%, rgba(99, 102, 241, 0.05) 0%, transparent 40%);
        }

        /* ── 3D Glass Setup Card ── */
        .setup-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            box-shadow: var(--card-shadow);
            width: 100%;
            max-width: 480px;
            padding: 44px;
            transform-style: preserve-3d;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            opacity: 0;
            transform: translateY(30px) translateZ(-50px);
        }

        .setup-card:hover {
            transform: translateY(-5px) translateZ(15px);
            box-shadow: 0 30px 60px rgba(15, 23, 42, 0.12);
            border-color: rgba(13, 148, 136, 0.3);
        }

        .brand-icon {
            width: 58px; height: 58px;
            background: var(--accent-gradient);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            color: #fff;
            margin: 0 auto 24px;
            box-shadow: 0 12px 30px var(--accent-glow);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .setup-card:hover .brand-icon {
            transform: rotate(15deg) scale(1.1);
        }

        h4 { 
            font-weight: 800; 
            letter-spacing: -0.5px; 
            color: #0f172a; 
        }

        .form-label { 
            font-size: 11px; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.8px; 
            color: #64748b; 
            margin-bottom: 8px; 
        }

        .form-control {
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.12);
        }

        .input-group-text { 
            background: #f1f5f9; 
            border: 1.5px solid #e2e8f0; 
            border-radius: 12px 0 0 12px; 
            color: #94a3b8; 
            font-weight: 600;
        }

        .btn-setup {
            background: var(--accent-gradient);
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            color: #fff;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        .btn-setup:hover {
            transform: translateY(-2px) translateZ(10px);
            box-shadow: 0 12px 30px rgba(13, 148, 136, 0.4);
            color: #fff;
        }

        .alert {
            border: 1px solid transparent;
            border-radius: 12px;
            font-size: 13px;
            padding: 12px 16px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>

<div class="bg-mesh"></div>

<div class="setup-card" id="setupCard">
    <div class="brand-icon"><i class="fa-solid fa-rocket"></i></div>
    
    <div class="text-center mb-4">
        <h4>Set up your account</h4>
        <p class="text-muted" style="font-size: 14px;">Finish setting up your profile to start managing your workspace.</p>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show shadow-sm mb-3" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" class="needs-validation" novalidate>
        {% csrf_token %}
        
        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control bg-light text-muted" value="{{ email }}" disabled>
        </div>

        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="full_name" class="form-control" placeholder="John Doe" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Username</label>
            <div class="input-group">
                <span class="input-group-text">@</span>
                <input type="text" name="username" class="form-control" placeholder="johndoe" required style="border-radius: 0 12px 12px 0;">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Create Password</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="mb-4">
            <label class="form-label">Phone Number (Optional)</label>
            <input type="text" name="phone" class="form-control" placeholder="+8801XXXXXXXXX">
        </div>

        <button type="submit" class="btn btn-setup w-100">
            Complete Registration <i class="fa-solid fa-arrow-right ms-2"></i>
        </button>
    </form>
</div>

<!-- GSAP 3 Animation Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // Cinematic 3D Entrance Animation via GSAP
    gsap.to("#setupCard", {
        opacity: 1,
        y: 0,
        z: 0,
        duration: 0.9,
        ease: "power3.out"
    });
});
</script>
</body>
</html>
