<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In — SocialManager</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --body-bg: #0f172a;
            --accent: #f25c38; /* আপনার ড্যাশবোর্ডের সিগনেচার কালার */
            --accent-glow: rgba(242, 92, 56, 0.25);
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body { 
            background: #020617;
            background-image: radial-gradient(at 0% 0%, #1e293b 0px, transparent 50%),
                              radial-gradient(at 100% 100%, #1e293b 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 48px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            position: relative;
            z-index: 2;
        }

        .brand-icon {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, var(--accent), #ff8a6f);
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            margin: 0 auto 24px;
            box-shadow: 0 10px 20px var(--accent-glow);
        }

        .form-label { font-size: 12px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }

        .input-group {
            background: rgba(0,0,0,0.2);
            border-radius: 14px;
            border: 1px solid var(--border-color);
            padding: 4px;
            transition: all 0.3s ease;
        }

        .input-group:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(242, 92, 56, 0.2);
        }

        .form-control {
            background: transparent !important;
            border: none !important;
            color: #fff !important;
            padding: 12px 16px;
        }

        .btn-submit {
            background: var(--accent);
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-weight: 700;
            color: #fff;
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px var(--accent-glow);
        }

        .alert {
            background: rgba(239, 68, 68, 0.1) !important;
            border: 1px solid rgba(239, 68, 68, 0.2) !important;
            color: #fca5a5 !important;
            border-radius: 12px !important;
        }
    </style>
</head>
<body>

<div class="login-card" id="login-card" style="opacity:0;">
    <div class="brand-icon"><i class="fa-solid fa-share-nodes"></i></div>
    <h4 class="text-center mb-4">Welcome Back</h4>

    {% if messages %}
    <div class="mb-4">
        {% for message in messages %}
        <div class="alert">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Username</label>
            <div class="input-group">
                <input type="text" name="username" class="form-control" placeholder="Enter username" required>
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label">Password</label>
            <div class="input-group">
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
        </div>
        <button type="submit" class="btn btn-submit w-100">Sign In</button>
    </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
    gsap.to("#login-card", {opacity: 1, y: 0, duration: 1, ease: "power4.out"});
</script>
</body>
</html>
