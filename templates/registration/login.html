<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login — SocialManager Pro</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --body-bg: #020617;
            --accent: #f97316;
            --accent-glow: rgba(249, 115, 22, 0.4);
            --card-bg: rgba(15, 23, 42, 0.7);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(249, 115, 22, 0.5);
            --text-dark: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { 
            box-sizing: border-box; 
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        body { 
            background-color: var(--body-bg); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* ── Dynamic Mesh Background & Cyber Grid ── */
        .bg-mesh {
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(249, 115, 22, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(59, 130, 246, 0.15) 0%, transparent 45%),
                linear-gradient(to right, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 45px 45px, 45px 45px;
            z-index: 0;
        }

        /* ── Interactive Ambient Glow Orbs ── */
        .ambient-glow {
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 1;
            pointer-events: none;
            opacity: 0.75;
            animation: moveOrbs 10s ease-in-out infinite alternate;
        }
        .glow-1 { top: -120px; left: -120px; background: rgba(249, 115, 22, 0.3); }
        .glow-2 { bottom: -120px; right: -120px; background: rgba(168, 85, 247, 0.25); animation-delay: -5s; }

        @keyframes moveOrbs {
            0% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(35px, 50px) scale(1.12); }
            100% { transform: translate(-25px, 20px) scale(0.92); }
        }

        /* ── Holographic Glass Card ── */
        .login-card { 
            background: var(--card-bg); 
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 30px; 
            padding: 44px; 
            width: 100%; 
            max-width: 440px; 
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border: 1px solid var(--border-glass);
            z-index: 10;
            position: relative;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .login-card:hover {
            border-color: var(--border-glow);
            box-shadow: 0 45px 90px rgba(0, 0, 0, 0.75), 0 0 35px rgba(249, 115, 22, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        /* ── Brand Header with Pulsing Icon ── */
        .brand-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 28px;
        }

        .brand-icon {
            width: 58px; height: 58px;
            background: linear-gradient(135deg, #f97316, #fb923c);
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            color: #fff;
            box-shadow: 0 12px 35px var(--accent-glow);
            margin-bottom: 14px;
            position: relative;
        }

        .brand-icon::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 22px;
            background: linear-gradient(135deg, #f97316, transparent);
            z-index: -1;
            opacity: 0.6;
            animation: pulseRing 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulseRing {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.12); opacity: 0; }
        }

        .brand-title { 
            color: var(--text-dark); 
            font-size: 23px; 
            font-weight: 800; 
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        /* ── Dynamic Glass Input Fields ── */
        .input-group {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            border: 1px solid var(--border-glass);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .input-group:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-1px);
        }

        .input-group-text, .password-toggle-btn {
            background: transparent;
            border: none;
            color: #64748b;
            padding-left: 16px;
            padding-right: 14px;
            transition: color 0.3s ease;
        }

        .password-toggle-btn {
            cursor: pointer;
            padding-left: 12px;
            padding-right: 16px;
        }

        .password-toggle-btn:hover {
            color: var(--accent);
        }

        .input-group:focus-within .input-group-text,
        .input-group:focus-within .password-toggle-btn {
            color: var(--accent);
        }

        .form-control {
            background: transparent;
            border: none;
            color: #fff;
            padding: 13px 14px 13px 0;
            font-size: 14.5px;
            box-shadow: none !important;
        }

        .form-control::placeholder {
            color: #475569;
        }

        /* ── High-Impact Shimmer Button ── */
        .btn-submit {
            background: linear-gradient(135deg, #f97316, #ea580c);
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 10px 30px var(--accent-glow);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.3px;
        }

        .btn-submit::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease-in-out;
        }

        .btn-submit:hover::after {
            transform: translateX(100%);
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 38px var(--accent-glow);
            background: linear-gradient(135deg, #fb923c, #f97316);
            color: #fff;
        }

        .btn-submit:active {
            transform: translateY(-1px);
        }

        .text-xs { font-size: 12px; }
        .hover-accent { transition: color 0.2s ease; }
        .hover-accent:hover { color: var(--accent) !important; }
    </style>
</head>
<body>

<!-- Ambient Dynamic Elements -->
<div class="bg-mesh"></div>
<div class="ambient-glow glow-1" id="glow-1"></div>
<div class="ambient-glow glow-2" id="glow-2"></div>

<div class="login-card" id="login-card" style="opacity:0; transform: translateY(40px);">
    
    <!-- Brand Header -->
    <div class="brand-wrap" id="brand-header">
        <div class="brand-icon" id="brand-icon"><i class="fa-solid fa-share-nodes"></i></div>
        <div class="brand-title">SocialManager</div>
        <small class="text-muted text-xs mt-1">Enterprise Workspace</small>
    </div>

    <!-- Django Error Alert Messages -->
    {% if messages %}
    <div class="mb-3" id="alerts-wrap">
        {% for message in messages %}
        <div class="alert alert-danger py-2 px-3 d-flex align-items-center gap-2 border-0 shadow-sm" role="alert" style="background: rgba(239, 68, 68, 0.15); color: #f87171; border-radius: 12px; font-size: 13px; backdrop-filter: blur(10px);">
            <i class="fa-solid fa-circle-exclamation text-xs"></i>
            <span>{{ message }}</span>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Authentication Form -->
    <form method="post" id="login-form">
        {% csrf_token %}
        
        <!-- Username input group -->
        <div class="mb-3 form-item" style="opacity:0; transform: translateY(15px);">
            <label class="form-label">Username</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-regular fa-user"></i></span>
                <input type="text" name="username" class="form-control" placeholder="Enter your username" required autocomplete="username">
            </div>
        </div>

        <!-- Password input group with Show/Hide toggle -->
        <div class="mb-4 form-item" style="opacity:0; transform: translateY(15px);">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label mb-0">Password</label>
                <a href="{% url 'accounts:change_password' %}" class="text-xs text-muted text-decoration-none hover-accent">Forgot?</a>
            </div>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                <input type="password" name="password" id="password-field" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                <button type="button" class="password-toggle-btn" id="toggle-password" tabindex="-1">
                    <i class="fa-regular fa-eye" id="toggle-icon"></i>
                </button>
            </div>
        </div>

        <!-- Action Button -->
        <button type="submit" class="btn btn-submit w-100 mb-3 form-item" id="submit-btn" style="opacity:0; transform: translateY(15px);">
            Sign In <i class="fa-solid fa-arrow-right-long ms-2"></i>
        </button>
    </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<!-- GSAP Animation Engine -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {
    gsap.config({ force3D: true });

    const timeline = gsap.timeline({ defaults: { ease: 'power3.out' } });

    // 1. Ambient lighting expansion
    timeline.from('#glow-1', { scale: 0.3, opacity: 0, duration: 1.2 })
            .from('#glow-2', { scale: 0.3, opacity: 0, duration: 1.2 }, '-=1')

    // 2. Main holographic card entrance with spring physics
    .to('#login-card', {
        opacity: 1,
        y: 0,
        duration: 0.9,
        ease: 'back.out(1.2)'
    }, '-=1')

    // 3. Brand Icon dynamic spring scale and rotate
    .from('#brand-icon', {
        scale: 0.2,
        rotate: -50,
        opacity: 0,
        duration: 0.6,
        ease: 'back.out(1.8)'
    }, '-=0.5')

    // 4. Staggered reveal for inputs and button
    .to('.form-item', {
        opacity: 1,
        y: 0,
        duration: 0.6,
        stagger: 0.1
    }, '-=0.4');

    // Password visibility toggle functionality
    const passwordField = document.getElementById('password-field');
    const togglePasswordBtn = document.getElementById('toggle-password');
    const toggleIcon = document.getElementById('toggle-icon');

    if (togglePasswordBtn && passwordField) {
        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = passwordField.type === 'password';
            passwordField.type = isPassword ? 'text' : 'password';
            
            // Toggle eye icon class with animation feel
            toggleIcon.classList.toggle('fa-eye', !isPassword);
            toggleIcon.classList.toggle('fa-eye-slash', isPassword);
        });
    }

    // Alert animation sequence if present
    const alert = document.getElementById('alerts-wrap');
    if (alert) {
        gsap.from(alert, {
            scale: 0.95,
            opacity: 0,
            duration: 0.4,
            ease: 'power2.out'
        });
    }
});
</script>
</body>
</html>
