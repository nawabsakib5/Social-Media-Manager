{% extends "base.html" %}
{% block title %}Change Password{% endblock %}

{% block content %}
<style>
    /* Enterprise Refinements */
    .password-card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        padding: 32px;
        max-width: 500px;
        margin: 0 auto;
    }
    
    .input-group-text {
        background: #f8fafc;
        border: 1.5px solid #e2e8f0;
        border-right: none;
        color: #94a3b8;
    }

    .form-control {
        border: 1.5px solid #e2e8f0;
        padding: 12px 16px;
        transition: all 0.3s ease;
    }

    .form-control:focus {
        border-color: var(--primary-brand);
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
    }

    .security-tip-box {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        padding: 16px;
        border-radius: 12px;
        font-size: 13px;
        color: #64748b;
    }

    .btn-update {
        background: var(--primary-gradient);
        color: white;
        border: none;
        padding: 12px;
        border-radius: 10px;
        font-weight: 700;
        width: 100%;
        transition: all 0.3s ease;
    }

    .btn-update:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
    }
</style>

<div class="container-fluid px-0">
    <!-- Header Section -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold mb-1">Change Password</h4>
            <p class="text-muted small">Update your credentials to secure your workspace.</p>
        </div>
        <a href="{% url 'post_list' %}" class="btn btn-light btn-sm px-3 rounded-pill fw-semibold">
            <i class="fa-solid fa-arrow-left me-2"></i>Back
        </a>
    </div>

    <!-- Password Form -->
    <div class="password-card">
        <form method="POST" class="needs-validation" novalidate>
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label text-xs fw-bold text-uppercase text-muted" style="font-size: 11px;">Current Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" name="old_pass" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label text-xs fw-bold text-uppercase text-muted" style="font-size: 11px;">New Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                    <input type="password" name="new_pass" class="form-control" placeholder="New password" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-xs fw-bold text-uppercase text-muted" style="font-size: 11px;">Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-check-double"></i></span>
                    <input type="password" name="con_pass" class="form-control" placeholder="Confirm new password" required>
                </div>
            </div>

            <div class="security-tip-box mb-4">
                <i class="fa-solid fa-shield-halved text-primary me-2"></i>
                <strong>Pro-tip:</strong> A strong password should be at least 8 characters long, including symbols and numbers.
            </div>

            <button type="submit" class="btn-update">
                Update Security Credentials
            </button>
        </form>
    </div>
</div>
{% endblock %}
