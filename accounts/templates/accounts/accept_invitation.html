<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Complete Setup | SocialManager</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --brand-primary: #4f46e5;
            --brand-gradient: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            --bg-color: #f8fafc;
            --card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .setup-card {
            background: #ffffff;
            border: 1px solid rgba(226, 232, 240, 1);
            border-radius: 24px;
            box-shadow: var(--card-shadow);
            width: 100%;
            max-width: 460px;
            padding: 40px;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-icon {
            width: 50px; height: 50px;
            background: var(--brand-gradient);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            color: #fff;
            margin: 0 auto 20px;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }

        h4 { font-weight: 800; letter-spacing: -0.5px; color: #0f172a; }

        .form-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #64748b; margin-bottom: 8px; }

        .form-control {
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background: #fff;
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .btn-setup {
            background: var(--brand-gradient);
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .btn-setup:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4);
        }

        .input-group-text { background: #f1f5f9; border: 1.5px solid #e2e8f0; border-radius: 10px 0 0 10px; color: #94a3b8; }
    </style>
</head>
<body>

<div class="setup-card">
    <div class="brand-icon"><i class="fa-solid fa-rocket"></i></div>
    
    <div class="text-center mb-4">
        <h4>Set up your account</h4>
        <p class="text-muted" style="font-size: 14px;">Finish setting up your profile to start managing your workspace.</p>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert" style="font-size: 13px;">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" class="needs-validation" novalidate>
        {% csrf_token %}
        
        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control bg-light" value="{{ email }}" disabled>
        </div>

        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="full_name" class="form-control" placeholder="John Doe" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Username</label>
            <div class="input-group">
                <span class="input-group-text">@</span>
                <input type="text" name="username" class="form-control" placeholder="johndoe" required style="border-radius: 0 10px 10px 0;">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Create Password</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="mb-4">
            <label class="form-label">Phone Number (Optional)</label>
            <input type="text" name="phone" class="form-control" placeholder="+8801XXXXXXXXX">
        </div>

        <button type="submit" class="btn btn-primary btn-setup w-100">
            Complete Registration <i class="fa-solid fa-arrow-right ms-2"></i>
        </button>
    </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
